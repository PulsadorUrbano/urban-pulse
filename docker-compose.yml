services:
  # -----------------------------------------------------------
  # 1. Base de Datos (PostgreSQL + PostGIS)
  # -----------------------------------------------------------
  database:
    image: imresamu/postgis:16-3.5-bookworm
    container_name: urbanpulse_db
    restart: always # 'always' es más robusto en producción que 'unless-stopped'
    # Forzamos que las variables vengan del sistema o de un archivo .env, sin valores por defecto inseguros
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta la variable DB_NAME}
      POSTGRES_USER: ${DB_USER:?Falta la variable DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta la variable DB_PASSWORD}
    # ELIMINADO: ports: - "5432:5432" -> Ahora solo el backend puede ver la base de datos
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ELIMINADO: - ./db:/docker-entrypoint-initdb.d:ro -> Delegamos las tablas al sistema de migraciones del backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urbanpulse_net

  # -----------------------------------------------------------
  # 2. Backend / API (NestJS)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanpulse_backend
    restart: always
    env_file:
      - .env # Centralizamos las variables en un archivo
    environment:
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}" # Acceso directo opcional a la API
    depends_on:
      database:
        condition: service_healthy
    networks:
      - urbanpulse_net

  # -----------------------------------------------------------
  # 3. Frontend web (React + Nginx)
  # -----------------------------------------------------------
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: urbanpulse_frontend_web
    restart: always
    environment:
      API_PORT: ${API_PORT:-3000}
      NGINX_ENVSUBST_FILTER: ^API_PORT$
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - urbanpulse_net

# -------------------------------------------------------------
# Volúmenes y Redes
# -------------------------------------------------------------
volumes:
  pgdata:

networks:
  urbanpulse_net:
    driver: bridge
