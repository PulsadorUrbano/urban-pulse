services:
  # -----------------------------------------------------------
  # 1. Base de Datos (PostgreSQL + PostGIS)
  # -----------------------------------------------------------
  database:
    image: imresamu/postgis:16-3.5-bookworm
    container_name: urbanpulse_db
    restart: always # 'always' es más robusto en producción que 'unless-stopped'
    # Forzamos que las variables vengan del sistema o de un archivo .env, sin valores por defecto inseguros
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta la variable DB_NAME}
      POSTGRES_USER: ${DB_USER:?Falta la variable DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta la variable DB_PASSWORD}
    # Acceso local desde el backend ejecutado fuera de Docker.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ELIMINADO: - ./db:/docker-entrypoint-initdb.d:ro -> Delegamos las tablas al sistema de migraciones del backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urbanpulse_net

  # -----------------------------------------------------------
  # 2. Backend / API (NestJS)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: urbanpulse_backend
    restart: always
    env_file:
      - .env # Centralizamos las variables en un archivo
    environment:
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}" # Acceso directo opcional a la API
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - urbanpulse_net

  # -----------------------------------------------------------
  # 3. Frontend web (React + Nginx)
  # -----------------------------------------------------------
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      target: development
    container_name: urbanpulse_frontend_web
    restart: always
    environment:
      URBAN_PULSE_PROXY_URL: http://backend:${API_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-8080}:5173"
    volumes:
      - ./frontend-web:/app
      - frontend_web_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - urbanpulse_net

  frontend-mobile:
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
      target: development
    container_name: urbanpulse_frontend_mobile
    restart: always
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_HOST_IP:-localhost}
      EXPO_PUBLIC_BACKEND_URL: ${EXPO_PUBLIC_BACKEND_URL:-http://${MOBILE_HOST_IP:-localhost}:${API_PORT:-3000}}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "${EXPO_PORT:-8081}:8081"
    volumes:
      - ./frontend-mobile:/app
      - frontend_mobile_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - urbanpulse_net

# -------------------------------------------------------------
# Volúmenes y Redes
# -------------------------------------------------------------
volumes:
  pgdata:
  backend_node_modules:
  frontend_web_node_modules:
  frontend_mobile_node_modules:

networks:
  urbanpulse_net:
    driver: bridge
